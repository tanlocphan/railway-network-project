# Railway Setup - same light theme as the Railway app (navy + orange)

@accentColor = #F26B1D
@background = #F4F6FB
@foreground = #18213A

Component.arc = 10
Button.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
ProgressBar.arc = 999
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.borderColor = #D7DEEA
Component.disabledBorderColor = #E3E8F1
Component.focusedBorderColor = #F26B1D
Component.focusColor = #FBD3BA

Button.margin = 7,16,7,16
Button.background = #FFFFFF
Button.borderColor = #D7DEEA
Button.hoverBorderColor = #F26B1D
Button.default.background = #F26B1D
Button.default.foreground = #FFFFFF
Button.default.borderColor = #F26B1D
Button.default.hoverBackground = #D5570C
Button.default.hoverBorderColor = #D5570C
Button.default.focusedBorderColor = #D5570C
Button.default.boldText = true

TextField.margin = 6,10,6,10
PasswordField.margin = 6,10,6,10
FormattedTextField.margin = 6,10,6,10
TextField.placeholderForeground = #8A93A6
ComboBox.padding = 5,10,5,10
ComboBox.buttonStyle = mac
ComboBox.selectionBackground = #FFF1E7
ComboBox.selectionForeground = #18213A

ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.width = 10
ScrollBar.showButtons = false
ScrollBar.track = #F4F6FB
ScrollPane.border = 0,0,0,0

Table.rowHeight = 40
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.gridColor = #EEF1F6
Table.intercellSpacing = 0,1
Table.selectionBackground = #FFF1E7
Table.selectionForeground = #18213A
Table.selectionInactiveBackground = #FFF6F0
Table.selectionInactiveForeground = #18213A
Table.cellFocusColor = #00000000
Table.focusCellHighlightBorder = 0,0,0,0
TableHeader.height = 38
TableHeader.background = #F8FAFD
TableHeader.foreground = #5B6478
TableHeader.separatorColor = #F8FAFD
TableHeader.bottomSeparatorColor = #E3E8F1

List.selectionBackground = #FFF1E7
List.selectionForeground = #18213A
List.selectionInactiveBackground = #FFF6F0
List.selectionInactiveForeground = #18213A

TabbedPane.underlineColor = #F26B1D
TabbedPane.inactiveUnderlineColor = #F7A877
TabbedPane.selectedForeground = #18213A
TabbedPane.foreground = #5B6478
TabbedPane.tabHeight = 42
TabbedPane.showTabSeparators = false
TabbedPane.hoverColor = #EEF1F6
TabbedPane.focusColor = #FFF1E7
TabbedPane.contentAreaColor = #E3E8F1

ToolTip.background = #18213A
ToolTip.foreground = #FFFFFF
ToolTip.border = 6,10,6,10

Popup.borderColor = #E3E8F1
PopupMenu.borderColor = #E3E8F1
ToggleButton.selectedBackground = #FFF1E7
ToggleButton.selectedForeground = #D5570C

TitlePane.background = #0E1B3D
TitlePane.inactiveBackground = #0E1B3D
TitlePane.foreground = #FFFFFF
TitlePane.inactiveForeground = #B7C2DC
TitlePane.embeddedForeground = #FFFFFF
TitlePane.buttonHoverBackground = #223A70
TitlePane.buttonPressedBackground = #182A55
